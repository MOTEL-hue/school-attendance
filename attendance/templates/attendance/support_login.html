{% extends "attendance/auth_base.html" %}{% block title %}כניסת תמיכה{% endblock %}
{% block card %}<h2>כניסת תמיכה 🛟</h2><p class="sub">הקוד נוצר על ידי בעל/ת המערכת בעמוד עזרה. הכניסה לצפייה בלבד ופגה אחרי 24 שעות.</p>
<form method="post">{% csrf_token %}<div class="field"><label>קוד תמיכה</label><input name="code" inputmode="numeric" autocomplete="off" placeholder="לדוגמה 12-34567890"></div>
{% if error %}<div class="err" style="margin-bottom:8px">{{ error }}</div>{% endif %}<button>כניסה</button></form>
<div class="auth-links"><a href="{% url 'login' %}">חזרה לכניסה</a></div>{% endblock %}
